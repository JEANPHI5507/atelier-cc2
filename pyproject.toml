[project]
name = "elegoo-lab"
version = "0.1.0"
description = "Atelier 3D autour de l'Elegoo Centauri Carbon 2 : tableau de bord, préparation multicolore CANVAS, caméra IA, tablette, CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "manifold3d>=3.5.4",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "onnxruntime>=1.18",
    "pillow>=13.0.0",
    "pycentauri[mcp,server]==0.9.1",  # reverse-engineered protocol: upgrade on purpose only
    "python-multipart>=0.0.33",
    "qrcode>=7",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[project.scripts]
cc2 = "elegoo_lab.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.45",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
