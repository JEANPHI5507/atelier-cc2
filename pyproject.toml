[project]
name = "elegoo-lab"
version = "0.1.0"
description = "Atelier 3D autour de l'Elegoo Centauri Carbon 2 : tableau de bord, preparation multicolore CANVAS, camera IA, tablette, CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cascadio>=0.1.1",
    "cryptography>=42",
    "defusedxml>=0.7.1",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "manifold3d>=3.5.4",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "onnxruntime>=1.18",
    "pillow>=13.0.0",
    "pycentauri[mcp,server]==0.9.1",
    "pycollada>=0.9.3",
    "python-multipart>=0.0.33",
    "qrcode>=7",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[project.scripts]
cc2 = "elegoo_lab.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.45",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.0",
    "isort>=5.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slicing: tests that require OrcaSlicer and OpenGL",
]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "S", "BLE", "FBT",
    "C90", "ICN", "ISC", "PIE", "PT", "Q", "RSE", "RET", "SIM",
    "TCH", "ARG", "PLC", "PLE", "PLW", "RUF"
]
ignore = [
    "E501", "B008", "C901", "PLW2901", "PLC0415", "RUF001", "RUF002",
    "RUF003", "S101", "S301", "S307", "S603", "S607", "UP007"
]

[tool.ruff.lint.per-file-ignores]
"src/elegoo_lab/web/js/*.js" = ["ALL"]
"tests/*" = ["S101", "PLR2004", "ARG001", "PLR0913", "PLR0915", "PT018", "E702", "PT011", "ARG005", "S310", "S108", "E731", "N814", "E741", "SIM115", "N802", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \\.git
    | \\.venv
    | build
    | dist
    | tools
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["elegoo_lab"]
known_third_party = [
    "cascadio", "cryptography", "fonttools", "httpx", "lxml",
    "manifold3d", "networkx", "numpy", "onnxruntime", "pillow",
    "pycentauri", "pycollada", "python-multipart", "qrcode",
    "scikit-image", "scipy", "trimesh"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = false

[[tool.mypy.overrides]]
module = ["pycentauri.*", "manifold3d.*", "trimesh.*", "numpy.*", "scipy.*", "scikit_image.*"]
ignore_missing_imports = true
