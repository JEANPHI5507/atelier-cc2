# Copie ce fichier en config.toml (ignoré par git) et remplis-le.

[printer]
host = ""          # IP de l'imprimante (fixe-la dans ta box: bail DHCP statique)
access_code = ""   # code d'accès affiché sur l'écran de l'imprimante (Réseau)
# serial = ""      # optionnel: numéro de série, évite l'appel HTTP :80 au démarrage

[comfyui]
url = "http://127.0.0.1:8188"   # ComfyUI sur la machine GPU, ex. "http://192.168.1.50:8188"

[dashboard]
port = 8787

[slicer]
# path = ""        # par défaut: tools/orcaslicer/squashfs-root/AppRun (installé par `make slicer`)

[tranchage]
# niveler = false  # retire le nivellement du G-code : déconseillé, la CC2 nivelle alors tout le plateau elle-même

[assistant]
# moteur = "cli"    # le cerveau de l'Assistant : "cli" (défaut) lance l'agent installé sur la machine
                    # (commande ci-dessous, déjà connecté à son compte — aucune clé API) ; "api" = Mistral.
# commande = "vibe" # le CLI agent à lancer hors écran (`vibe -p …`) ; ses serveurs MCP (Blender…) restent actifs.
# reflexion = "off" # (moteur "cli") niveau de réflexion du CLI : "off" (défaut, rapide), "low", "medium", "high"
                    # (mieux pour la CAO complexe, deux fois plus lent).
# modele_cli = ""   # (moteur "cli") alias de modèle du CLI ; vide = son modèle habituel.
# api_key = ""      # (moteur "api" seulement) clé Mistral (console.mistral.ai), ou variable MISTRAL_API_KEY.
# model = "mistral-large-latest"   # (moteur "api" seulement)
