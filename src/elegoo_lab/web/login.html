<!doctype html>
<html lang="fr" translate="no">
<head>
<meta name="google" content="notranslate">
<script src="js/i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Centauri Carbon 2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#465060">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg: #3b4452; --surface: #465060; --line: #5e6a7c; --txt: #f2f4f7; --dim: #c9d0da; --acc: #ff8a3d; --bad: #ff8589; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--txt);
         font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .card { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  .logo { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 14px; background: linear-gradient(135deg, var(--acc), #ff4d2f); }
  h1 { font-size: 19px; margin: 0 0 4px; } p { color: var(--dim); margin: 0 0 20px; font-size: 14px; }
  input { width: 100%; height: 56px; text-align: center; font-size: 28px; letter-spacing: .35em; border-radius: 12px; border: 1px solid var(--line);
          background: var(--bg); color: var(--txt); outline: none; }
  input:focus { border-color: var(--acc); }
  button { font: inherit; width: 100%; height: 50px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--acc); color: #2a1404; font-size: 16px; font-weight: 650; }
  .err { color: var(--bad); min-height: 22px; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="logo"></div>
    <h1>Atelier Centauri Carbon 2</h1>
    <p>Saisis le code d'accès affiché au lancement de l'atelier sur le PC.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="12" aria-label="Code d'accès" autofocus>
    <button>Entrer</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const r = await fetch('/lab/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('code').value }) });
  if (r.ok) { location.href = '/lab/'; return; }
  document.getElementById('err').textContent = (await r.json().catch(() => ({}))).detail || 'Erreur';
  document.getElementById('code').select();
};
</script>
</body>
</html>
