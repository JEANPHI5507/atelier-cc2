line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "B", "C4", "UP", "N", "S", "BLE", "FBT", "C90", "ICN", "ISC", "PIE", "PT", "Q", "RSE", "SIM", "TCH", "ARG"]
ignore = [
    "E501",      # line too long (handled by black)
    "B008",      # do not perform function calls in argument defaults
    "C901",      # too complex
    "S101",      # assert used (tests: per-file-ignored)
    "S301",      # pickle
    "S307",      # eval
    "UP007",     # non-pep604-annotation
    "F401",      # unused import (some are intentional for availability checks)
    "F811",      # redefined name (some are intentional)
    "FBT001",    # boolean-typed positional argument (will fix gradually)
    "FBT002",    # boolean default positional argument (will fix gradually)
    "FBT003",    # boolean positional value in function call (will fix gradually)
    "S104",      # binding to all interfaces (0.0.0.0) is intentional for local server
    "S311",      # random.randrange for seed is not for crypto
]

[lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "PLR0913", "PLR0915", "PT018", "E702", "PT011", "ARG005", "S310", "S108", "S603", "BLE001", "E731", "N814", "E741", "SIM115", "N802", "E402"]
"src/elegoo_lab/web/*" = ["ALL"]
"src/elegoo_lab/threemf.py" = ["N817"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.isort]
combine-as-imports = true
known-first-party = ["elegoo_lab"]
