line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "BLE", "FBT", "C90", "ICN", "ISC", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TCH", "ARG"]
ignore = ["E501", "B008", "C901", "S101", "S301", "S307", "S603", "S607", "UP007"]

[lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
