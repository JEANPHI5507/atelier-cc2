name: Tests Automatiques

# Workflow pour executer les tests automatiquement sur chaque PR
# et pour verifier les changements avant merge.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Type de tests'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - slicing
          - ui
          - integration

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.9"

jobs:
  # Job 1: Tests unitaires rapides (sans OrcaSlicer)
  unit-tests:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Dependencies
        run: |
          uv sync

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-urw-base35

      - name: Run Fast Tests
        run: |
          # Execute les tests qui ne necessitent pas OrcaSlicer
          uv run pytest tests/test_core.py -v --tb=short -m "not slicing"

  # Job 2: Tests avec OrcaSlicer (si disponible)
  slicing-tests:
    name: Slicing Tests (with OrcaSlicer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Dependencies
        run: |
          uv sync

      - name: Install slicer runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libwebkit2gtk-4.1-0

      - name: Install OrcaSlicer
        run: |
          make slicer

      - name: Run Slicing Tests
        run: |
          # Execute uniquement les tests de decoupe
          uv run pytest tests/test_core.py -v --tb=short -m "slicing"

  # Job 3: Tests UI avec Playwright (si Chrome est disponible)
  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Dependencies
        run: |
          uv sync

      - name: Install Playwright chromium and its system libraries
        run: |
          uv run playwright install chromium --with-deps

      - name: Run UI Tests
        run: |
          uv run pytest tests/test_ui.py -v --tb=short

  # Job 4: Tests d'integration avec le simulateur
  integration-tests:
    name: Integration Tests (Simulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Dependencies
        run: |
          uv sync

      - name: Run Simulator Tests
        run: |
          uv run pytest tests/test_core.py -k "simulator" -v --tb=short
